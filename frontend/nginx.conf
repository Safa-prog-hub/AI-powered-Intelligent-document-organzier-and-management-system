# nginx.conf — SPA serving + /api reverse proxy (Phase 8)
server {
    listen 80;
    server_name _;

    # Static assets built by Vite.
    root /usr/share/nginx/html;
    index index.html;

    # API traffic → Node.js gateway (internal Docker DNS name).
    location /api/ {
        proxy_pass http://node-api:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;   # AI processing can exceed default timeouts
        client_max_body_size 16m;  # uploads up to 15MB
    }

    # SPA fallback — let React Router handle client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
